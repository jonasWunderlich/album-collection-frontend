<app-nav />

<app-controls-row />

<div class="album-grid">
  @for (album of albums(); track album.urlCover; let i = $index) {
    <app-album-tile [album]="album" [lazy]="i > pageSize" />
  } @empty {
    @if (!isLoading()) {
      <div class="no-albums">No albums found for this period.</div>
    }
  }
</div>

<!-- Triggert das Nachladen, wenn es im Viewport sichtbar wird -->
<div #scrollAnchor class="scroll-anchor">
  @if (isLoading()) {
    <div class="loading-spinner">Loading more albums...</div>
  }
</div>

<app-scroll-top-button />
