<div class="pw-overlay" [class.hidden]="!visible()">
  <div class="pw-dialog">
    <h2 class="pw-title">🔒 Passwort erforderlich</h2>
    <p class="pw-subtitle">Wegen Bildrechten habe ich ein Passwort eingerichtet das einmalig eingegeben werden muss, solange es sich nicht ändert. Bitte schreib mich fix an und ich schicke es dir.</p>
    <form class="pw-form" (ngSubmit)="submit()">
      <input
        #pwInput
        class="pw-input"
        type="password"
        placeholder="Passwort"
        [(ngModel)]="password"
        name="password"
        autocomplete="current-password"
        [disabled]="loading()"
      />
      <button class="pw-btn" type="submit" [disabled]="loading() || !password">
        @if (loading()) {
          <span class="pw-spinner"></span>
        } @else {
          Einloggen
        }
      </button>
    </form>
    @if (error()) {
      <p class="pw-error">❌ Falsches Passwort. Bitte versuche es erneut.</p>
    }
  </div>
</div>
