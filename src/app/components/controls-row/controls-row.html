<div class="search-container">
  <input
    type="text"
    id="myInput"
    [value]="filterSettings().search"
    (input)="updateSearch($event)"
    placeholder="Search &amp; Filter Records .."
  />

  @if (filterSettings().search) {
    <button
      type="button"
      class="reset-btn"
      (click)="clearSearch()"
      aria-label="Suchfeld zurücksetzen"
    >
      ✖
    </button>
  }
</div>

<div class="sort-controls">
  <div class="sort-group">
    <app-sort-button
      [active]="filterSettings().sortBy === SortOptions.rating"
      [direction]="filterSettings().direction"
      label="Bewertung"
      (click)="setSort(SortOptions.rating)"
    />
    <app-sort-button
      [active]="filterSettings().sortBy === SortOptions.artist"
      [direction]="filterSettings().direction"
      label="Artist"
      (click)="setSort(SortOptions.artist)"
    />
    <app-sort-button
      [active]="filterSettings().sortBy === SortOptions.addedDate"
      [direction]="filterSettings().direction"
      label="Hinzugefügt"
      (click)="setSort(SortOptions.addedDate)"
    />
  </div>

  <div class="filter-group">
    <button
      type="button"
      class="filter-button"
      [class.active]="filterSettings().filterBy.includes(FilterOptions.tino)"
      (click)="setFilter(FilterOptions.tino)"
    >
      Tino
    </button>
    <button
      type="button"
      class="filter-button"
      [class.active]="filterSettings().filterBy.includes(FilterOptions.wire)"
      (click)="setFilter(FilterOptions.wire)"
    >
      Wire
    </button>
  </div>
</div>
