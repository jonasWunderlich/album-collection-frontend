<div class="search-container">
  <input
    type="text"
    id="myInput"
    [value]="filters().search"
    (input)="updateSearch($event)"
    placeholder="Search &amp; Filter Records .."
  />

  @if (filters().search) {
    <button type="button" class="reset-btn" (click)="clearSearch()" aria-label="Suchfeld zurücksetzen">✖</button>
  }
</div>

<div class="sort-controls">
  <app-sort-button
    [active]="filters().sortBy === SortOptions.rating"
    [direction]="filters().sortDir"
    label="Rating"
    (click)="setSort(SortOptions.rating)"
  />

  @if (!filters().releaseYear) {
    <app-sort-button
      [active]="filters().sortBy === SortOptions.releaseYear"
      [direction]="filters().sortDir"
      label="Jahr"
      (click)="setSort(SortOptions.releaseYear)"
    />
  }

  <app-sort-button
    [active]="filters().sortBy === SortOptions.addedDate"
    [direction]="filters().sortDir"
    label="Added"
    (click)="setSort(SortOptions.addedDate)"
  />
  <app-sort-button
    [active]="filters().sortBy === SortOptions.lastPlayedDate"
    [direction]="filters().sortDir"
    label="Played"
    (click)="setSort(SortOptions.lastPlayedDate)"
  />

  @if (!filters().albumArtist) {
    <app-sort-button
      [active]="filters().sortBy === SortOptions.artist"
      [direction]="filters().sortDir"
      label="Artist"
      (click)="setSort(SortOptions.artist)"
    />
  }

  <button type="button" class="filter-button" [class.active]="filters().tino" (click)="toggleFilter('tino')">
    Tino
  </button>
  <button type="button" class="filter-button" [class.active]="filters().wire" (click)="toggleFilter('wire')">
    Wire
  </button>
  <button type="button" class="filter-button" [class.active]="!showInfos" (click)="showInfosChange.emit(!showInfos)">
    i
  </button>
</div>
