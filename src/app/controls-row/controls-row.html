<div class="search-container">
    <input type="text" id="myInput" (keyup)="updateSearch($event.target.value)"
        placeholder="Search &amp; Filter Records ..">
    <span class="clear-icon" (click)="clearSearch()" title="Clear">✖</span>
</div>

<div class="sort-controls">
    <div class="sort-group">
        <app-sort-button [active]="filterSettings.sortBy === 'rating'" [direction]="filterSettings.direction"
            label="Bewertung" (click)="updateSort('rating')" />
        <app-sort-button [active]="filterSettings.sortBy === 'artist'" [direction]="filterSettings.direction"
            label="Artist" (click)="updateSort('artist')" />
        <app-sort-button [active]="filterSettings.sortBy === 'addedDate'" [direction]="filterSettings.direction"
            label="Hinzugefügt" (click)="updateSort('addedDate')" />
    </div>
    <div class="filter-group">
        <button class="filter-button" [class.active]="filterSettings.filterBy.includes('tino')"
            (click)="updateFilter('tino')">Tino</button>
        <button class="filter-button" [class.active]="filterSettings.filterBy.includes('wire')"
            (click)="updateFilter('wire')">Wire</button>
    </div>
</div>
