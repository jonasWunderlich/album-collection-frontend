<div class="album-poster">
    <img src="image.png" [alt]="album.title" loading="lazy">
    <div class="vinyl-overlay" title="Owned (Vinyl)"></div>
    <div class="top-left-icons">
        <a [href]="album.videoUrl" target="_blank" class="video-icon" title="Watch Video"></a>

    </div>
    <div class="top-right-icons">
        <div class="rating-circle" title="">{{ album.rating }}</div>
    </div>
    <div class="album-overlay">
        <div class="overlay-bookmarks">

        </div>
        <div class="album-artist"><a [href]="album.bandcampUrl" target="_blank">{{
                album.artist }}</a><span class="inline-icon" title="Fan/Favorite">❤️</span></div>
        <div class="album-title">
            <a [href]="album.bandcampUrl" target="_blank">{{ album.title }}</a>

        </div>
        <div class="album-label" [title]="album.publisher">{{ album.publisher }}</div>
        <div class="album-meta">
            <div class="location">
                <div class="album-country">{{ album.country }}</div>
                <div class="album-city">{{ album.city }}</div>
            </div>
            <div class="genre">
                <div class="album-genre">{{ album.genre }}</div>
                <div class="album-style">{{ album.style }}</div>
            </div>
        </div>
    </div>
</div>
